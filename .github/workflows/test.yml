name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundry-tests:
    name: Foundry tests (Solidity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (brings in @openzeppelin/contracts)
        run: bun install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run forge tests
        run: forge test -vv

      - name: Gas report
        run: forge test --gas-report 2>&1 | tail -40

  signal-tests:
    name: Signal engine tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run signal tests
        run: bun test server/signal.test.ts

  lint-typecheck:
    name: Lint + typecheck (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint + typecheck
        run: bash scripts/check.sh
