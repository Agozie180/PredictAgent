name: Deploy PredictAgent to Arc Mainnet

on:
  workflow_dispatch:
    inputs:
      contract:
        description: "Which contract to deploy"
        required: true
        default: "PredictAgent"
        type: choice
        options:
          - PredictAgent
          - PredictAgentChainlink
          - SellerRegistry
      signal_fee_usdc:
        description: "Signal fee in USDC (6 decimals). 1000000 = $1.00"
        required: true
        default: "1000000"
      dry_run:
        description: "Dry run — build and verify ABI only, do not broadcast"
        required: false
        default: "false"
        type: boolean

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.contract }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to write contract address back to repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (brings in @openzeppelin/contracts)
        run: bun install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build
        working-directory: .

      - name: Verify secrets are present
        run: |
          if [ -z "${{ secrets.DEPLOYER_PRIVATE_KEY }}" ]; then
            echo "❌ DEPLOYER_PRIVATE_KEY secret is not set"
            echo "Go to Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ -z "${{ secrets.OWNER_ADDRESS }}" ]; then
            echo "❌ OWNER_ADDRESS secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.SELLER_ADDRESS }}" ]; then
            echo "❌ SELLER_ADDRESS secret is not set"
            exit 1
          fi
          echo "✅ All required secrets present"

      - name: Dry run — ABI check only
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN: contract builds and secrets are present ==="
          echo "Contract:      ${{ github.event.inputs.contract }}"
          echo "Fee (6-dec):   ${{ github.event.inputs.signal_fee_usdc }}"
          echo "Owner:         ${{ secrets.OWNER_ADDRESS }}"
          echo "Seller:        ${{ secrets.SELLER_ADDRESS }}"
          echo "=== Would deploy to Arc mainnet (RPC: https://rpc.arc.io) ==="
          forge inspect ${{ github.event.inputs.contract }} abi | head -5
          echo "✅ Dry run complete — re-run with dry_run=false to broadcast"

      - name: Deploy contract
        if: ${{ github.event.inputs.dry_run == 'false' }}
        id: deploy
        run: |
          echo "Deploying ${{ github.event.inputs.contract }} to Arc mainnet..."
          OUTPUT=$(forge create \
            contracts/${{ github.event.inputs.contract }}.sol:${{ github.event.inputs.contract }} \
            --rpc-url https://rpc.arc.io \
            --private-key ${{ secrets.DEPLOYER_PRIVATE_KEY }} \
            --constructor-args \
              ${{ secrets.SELLER_ADDRESS }} \
              ${{ github.event.inputs.signal_fee_usdc }} \
              ${{ secrets.OWNER_ADDRESS }} \
            --legacy \
            2>&1)
          echo "$OUTPUT"
          # Extract deployed address
          CONTRACT_ADDRESS=$(echo "$OUTPUT" | grep "Deployed to:" | awk '{print $3}')
          TX_HASH=$(echo "$OUTPUT" | grep "Transaction hash:" | awk '{print $3}')
          if [ -z "$CONTRACT_ADDRESS" ]; then
            echo "❌ Could not extract contract address from forge output"
            exit 1
          fi
          echo "contract_address=$CONTRACT_ADDRESS" >> $GITHUB_OUTPUT
          echo "tx_hash=$TX_HASH" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $CONTRACT_ADDRESS"
          echo "🔗 TX: https://explorer.arc.io/tx/$TX_HASH"

      - name: Write deployment record
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          mkdir -p contracts/contract-metadata
          cat > contracts/contract-metadata/${{ github.event.inputs.contract }}-mainnet.json << EOF
          {
            "contract": "${{ github.event.inputs.contract }}",
            "address": "${{ steps.deploy.outputs.contract_address }}",
            "txHash": "${{ steps.deploy.outputs.tx_hash }}",
            "chain": "Arc Mainnet",
            "chainId": 5042,
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "deployer": "${{ secrets.OWNER_ADDRESS }}",
            "signalFeeUsdc": "${{ github.event.inputs.signal_fee_usdc }}"
          }
          EOF
          echo "📄 Deployment record written"

      - name: Update AGENTS.md with contract address
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          # Append to AGENTS.md if it exists
          if [ -f AGENTS.md ]; then
            echo "" >> AGENTS.md
            echo "## Deployed: ${{ github.event.inputs.contract }}" >> AGENTS.md
            echo "- Address: \`${{ steps.deploy.outputs.contract_address }}\`" >> AGENTS.md
            echo "- TX: \`${{ steps.deploy.outputs.tx_hash }}\`" >> AGENTS.md
            echo "- Chain: Arc Mainnet (5042)" >> AGENTS.md
            echo "- Fee: ${{ github.event.inputs.signal_fee_usdc }} (6-decimal USDC)" >> AGENTS.md
            echo "- Deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> AGENTS.md
          fi

      - name: Commit deployment record
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "deploy: ${{ github.event.inputs.contract }} to Arc mainnet @ ${{ steps.deploy.outputs.contract_address }}"
          file_pattern: "contracts/contract-metadata/*.json AGENTS.md"
          commit_author: "Agozie180 <chiagozieokafor180@gmail.com>"

      - name: Job summary
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          echo "## Deployment complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | ${{ github.event.inputs.contract }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Address | \`${{ steps.deploy.outputs.contract_address }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| TX | [${{ steps.deploy.outputs.tx_hash }}](https://explorer.arc.io/tx/${{ steps.deploy.outputs.tx_hash }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Explorer | [View contract](https://explorer.arc.io/address/${{ steps.deploy.outputs.contract_address }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Fee | ${{ github.event.inputs.signal_fee_usdc }} (6-dec USDC) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next: set \`VITE_CONTRACT_ADDRESS=${{ steps.deploy.outputs.contract_address }}\` in your Vercel environment variables." >> $GITHUB_STEP_SUMMARY
